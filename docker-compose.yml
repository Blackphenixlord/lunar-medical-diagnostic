# MDX — one command to run the whole system.
#
#   docker compose up
#   -> http://localhost:8000
#
# Two containers on purpose:
#   ollama  the language model. Big, slow to pull, changes almost never.
#   mdx     the engine, knowledge base and UI. Small, changes constantly.
#
# Keeping them apart means editing a diagnostic rule rebuilds a 200MB image in
# seconds instead of re-downloading a 2GB model.

services:

  ollama:
    image: ollama/ollama:latest
    container_name: mdx-ollama
    ports:
      - "11434:11434"          # exposed so `python -m mdx ask` works outside docker too
    volumes:
      - ollama-models:/root/.ollama   # models survive `docker compose down`
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mdx:
    build: .
    container_name: mdx-app
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MDX_OLLAMA_MODEL: ${MDX_OLLAMA_MODEL:-llama3.2}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Live-mount the knowledge base and prompts so Joaquin can edit a rule and
      # just refresh the browser. No rebuild, no Python, no Docker knowledge.
      - ./kb:/app/kb:ro
      - ./prompts:/app/prompts:ro
      - ./cases:/app/cases:ro

volumes:
  ollama-models:
