# VITALS — one command to run the whole system.
#
#   docker compose build      once, WITH a network - bakes the model into an image
#   docker compose up         any time after, with or without one
#   -> http://localhost:8000
#
# Two containers on purpose:
#   ollama  the language model. Big, slow to build, changes almost never.
#   vitals  the engine, knowledge base and UI. Small, changes constantly.
#
# Keeping them apart means editing a diagnostic rule rebuilds a 200MB image in
# seconds instead of re-downloading a 2GB model.
#
# CHOOSING THE MODEL - one variable, read in both places below, so the model the
# app asks for is always the model that was baked in:
#
#   VITALS_OLLAMA_MODEL=llama3.2:1b docker compose build
#   VITALS_OLLAMA_MODEL=llama3.2:1b docker compose up
#
# (Or put VITALS_OLLAMA_MODEL=... in a .env file next to this one.)

services:

  ollama:
    # Built, not pulled. The stock ollama/ollama image ships with NO models, so
    # the first question of the day would be a 3GB download - on a locked-down
    # school or JSC network that is a failure, not a wait.
    # See docker/ollama.Dockerfile.
    build:
      context: ./docker
      dockerfile: ollama.Dockerfile
      args:
        MODEL: ${VITALS_OLLAMA_MODEL:-llama3.2}
    image: vitals-ollama:latest
    container_name: vitals-ollama
    ports:
      - "11434:11434"          # exposed so `python -m vitals ask` works outside docker too
    volumes:
      # Extra models pulled at runtime survive `docker compose down`.
      # A NEW, empty named volume is seeded from the image, so the baked model
      # shows up in it. An OLD volume is not re-seeded and would hide the baked
      # model - which is why this is not the old `ollama-models` volume.
      # Changed the model and it seems missing?  docker compose down -v
      - vitals-ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  vitals:
    build: .
    image: vitals-app:latest
    container_name: vitals-app
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      VITALS_OLLAMA_MODEL: ${VITALS_OLLAMA_MODEL:-llama3.2}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Live-mount the knowledge base and prompts so Joaquin can edit a rule and
      # just refresh the browser. No rebuild, no Python, no Docker knowledge.
      - ./kb:/app/kb:ro
      - ./prompts:/app/prompts:ro
      - ./cases:/app/cases:ro

volumes:
  vitals-ollama-models:
