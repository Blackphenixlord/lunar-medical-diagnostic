# GPU overlay for the Jetson. Use ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.jetson.yml build
#   docker compose -f docker-compose.yml -f docker-compose.jetson.yml up
#
# Without this, ollama runs on the CPU - which on a Jetson is painfully slow.
#
# Compose merges files BY SERVICE NAME. A service here only changes the service
# of the same name in docker-compose.yml; a new name silently declares a second,
# unrelated service. That exact bug shipped once (`vitals` here, `mdx` there),
# so check `docker compose -f docker-compose.yml -f docker-compose.jetson.yml config`
# after renaming anything.
#
# BEFORE THIS WORKS
#   1. The Jetson needs the NVIDIA Container Toolkit. That is part of the
#      "Flash Ubuntu on the Jetson" board item, not something Docker installs.
#   2. BUILD ON THE JETSON. A Jetson is arm64; an image built on an x86 laptop
#      will not run on it. `docker compose build` on the Jetson itself is the
#      simplest correct answer.
#
# WHICH MODEL
#   llama3.2 (3B, the default) fits comfortably in Orin Nano memory alongside
#   the OS and the UI. Tight on memory: llama3.2:1b. Orin NX or better:
#   llama3.1:8b reasons noticeably better on the harder complaints.
#   Set it ONCE, with VITALS_OLLAMA_MODEL - docker-compose.yml feeds that one
#   variable to both the model bake and the app:
#
#   VITALS_OLLAMA_MODEL=llama3.2:1b docker compose -f docker-compose.yml -f docker-compose.jetson.yml build

services:

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Keep the model resident in GPU memory. Reloading it is the slow part,
      # and a demo where the second question takes 40 seconds looks broken.
      OLLAMA_KEEP_ALIVE: 24h
