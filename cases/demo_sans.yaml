title: "FD 118 - reading is getting harder"
narrative: >
  Around flight day 118. Reading the procedure cards is getting harder, close up is blurry.
  Refraction is about 1.0 diopters more hyperopic than my preflight baseline.
  OCT shows disc edema and choroidal folds. No double vision, no whooshing in my ears.
