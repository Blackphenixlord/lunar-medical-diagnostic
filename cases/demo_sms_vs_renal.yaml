title: "FD 2 - nausea and vomiting, no flank pain (the SMS look-alike)"
narrative: >
  Second day on orbit. I keep feeling like I am going to throw up, and it gets much
  worse every time I turn my head. Threw up twice. Cold sweats. No pain in my side,
  no blood in my urine.
