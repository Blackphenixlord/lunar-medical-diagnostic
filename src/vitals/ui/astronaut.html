<!doctype html>
<!--
  VITALS - astronaut screen (AUI).

  WHAT IT DOES
    Chat:    describe how you feel, get an answer, answer VITALS' follow-up
             questions. Every turn stays on screen.
    Profile: the logged-in crewmember's details, from their account.
    Vitals:  sensor readings. None are connected yet, so it says so.

  RULES THIS PAGE FOLLOWS (from UI_ACCEPTANCE_CRITERIA.md)
    - It renders what the server sends. Conditions, reasons, advice and sources
      all come from the engine; none of that wording is typed in here.
    - The escalation level is always a WORD plus a color, never color alone.
    - No percentages or scores anywhere. Confidence is shown as words.
    - No made-up vital signs. Unconnected sensors say "Not connected".
    - Server errors are shown exactly as the server wrote them.
    - Works offline: one file, nothing loaded from the internet.

  WHO IS LOGGED IN
    The server knows, through an HttpOnly cookie. This page asks /api/me and
    sends you back to the PIN screen if nobody is.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITALS - astronaut</title>
<style>
  /* ==== colors ============================================================
     Every text color passes 4.5:1 contrast on the background it sits on. */
  :root {
    --bg:       #1e1e1e;   /* main area */
    --side:     #2b2b2b;   /* sidebar */
    --card:     #2b2b2b;
    --card-2:   #353535;
    --line:     #4d4d4d;
    --ink:      #f2f2f2;
    --muted:    #bdbdbd;
    --accent:   #6cb4ff;
    --accent-ink:#0b1a2a;
    --error-bg: #3b1d1d;
    --error-ink:#ffb4ab;

    /* escalation levels: background + text color for each */
    --emergency-bg: #c5221f; --emergency-ink: #ffffff;
    --urgent-bg:    #f28b00; --urgent-ink:    #111111;
    --monitor-bg:   #fdd663; --monitor-ink:   #111111;
    --routine-bg:   #81c995; --routine-ink:   #111111;
    --none-bg:      #5f6368; --none-ink:      #ffffff;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;  /* readable at arm's length */
  }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* ==== layout: sidebar + main ============================================ */
  /* The page never scrolls; only the conversation does, so the message box stays put. */
  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    flex: 0 0 200px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 10px;
    background: var(--side);
  }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: 2px; padding: 0 8px 12px; }

  .tab {
    display: flex; align-items: center; gap: 12px;
    min-height: 52px;                 /* tap targets: 44px minimum */
    padding: 0 12px;
    border: 0; border-radius: 10px;
    background: transparent; color: var(--ink);
    text-align: left;
  }
  .tab svg { width: 24px; height: 24px; flex: none; }
  .tab.active { background: var(--card-2); box-shadow: inset 4px 0 0 var(--accent); }

  .who { margin-top: auto; padding: 12px 8px 4px; border-top: 1px solid var(--line); font-size: 15px; }
  .who .name { font-weight: 600; }
  .who .role { color: var(--muted); }
  .lock {
    min-height: 48px; margin-top: 8px; border: 1px solid var(--line);
    border-radius: 10px; background: transparent; color: var(--ink);
  }

  main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  .topbar h1 { margin: 0; font-size: 20px; }
  .topbar .note { color: var(--muted); font-size: 14px; }

  .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .panel-body { padding: 18px 22px; overflow-y: auto; }

  /* Narrow screens: sidebar becomes a row across the top. */
  @media (max-width: 700px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .sidebar { flex: none; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .brand { padding: 0 8px; }
    .who { margin: 0 0 0 auto; border: 0; padding: 0 8px; }
  }

  /* ==== chat ============================================================== */
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 22px; position: relative; }
  .empty-hint { color: var(--muted); max-width: 560px; }

  .bubble {
    max-width: 75%; margin: 10px 0 10px auto; padding: 10px 14px;
    border-radius: 14px 14px 4px 14px; background: var(--card-2);
    white-space: pre-wrap;
  }
  .bubble .label { display: block; font-size: 13px; color: var(--muted); }

  .notice {
    margin: 0 22px; padding: 10px 14px; border-radius: 10px;
    background: var(--error-bg); color: var(--error-ink); font-size: 15px;
  }

  .composer { padding: 12px 22px 18px; border-top: 1px solid var(--line); }
  .asking { margin: 0 0 8px; font-size: 18px; }
  .asking b { color: var(--accent); }
  .composer-row { display: flex; gap: 10px; align-items: stretch; }
  .composer textarea {
    flex: 1; min-height: 60px; max-height: 180px; resize: vertical;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font: inherit;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .send {
    min-width: 96px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
  }
  .composer .row2 { display: flex; justify-content: space-between; margin-top: 8px; }
  .link-button {
    min-height: 44px; padding: 0 12px; border: 0; background: transparent;
    color: var(--muted); text-decoration: underline;
  }

  /* ---- "VITALS is thinking" ---- */
  .working { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 14px 0; }
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- the answer card ---- */
  .answer { margin: 14px 0 22px; border-radius: 12px; overflow: hidden; background: var(--card); }

  .level { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 14px 18px; }
  .level .word { font-size: 26px; font-weight: 800; letter-spacing: 1.5px; }
  .level .escalate { font-weight: 700; }
  .level .reason { flex-basis: 100%; font-size: 15px; }
  .level.emergency { background: var(--emergency-bg); color: var(--emergency-ink);
                     border: 5px solid #ffffff; }           /* never "a slightly different red" */
  .level.emergency .word::before { content: "!! "; }
  .level.urgent    { background: var(--urgent-bg);  color: var(--urgent-ink); }
  .level.monitor   { background: var(--monitor-bg); color: var(--monitor-ink); }
  .level.routine   { background: var(--routine-bg); color: var(--routine-ink); }
  .level.none      { background: var(--none-bg);    color: var(--none-ink); }

  .answer-body { padding: 14px 18px 16px; }
  .answer h3 { margin: 16px 0 6px; font-size: 14px; letter-spacing: 1px;
               text-transform: uppercase; color: var(--muted); }
  .answer h3:first-child { margin-top: 0; }
  .answer ul { margin: 4px 0; padding-left: 22px; }

  .condition { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .condition:last-child { border-bottom: 0; }
  .condition .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .condition .name { font-size: 18px; font-weight: 650; }
  .condition .strength { font-size: 14px; color: var(--muted); }
  .condition .why { margin: 4px 0; }
  .condition .source { font-size: 15px; }
  .condition .no-source { color: var(--error-ink); font-size: 15px; }

  details.known { margin-top: 12px; }
  details.known summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--muted); }
  .known-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .known-row .fix {
    min-height: 44px; min-width: 88px; border: 1px solid var(--line);
    border-radius: 8px; background: transparent; color: var(--ink);
  }
  .corrected { color: var(--muted); font-size: 14px; }

  .error-card { margin: 14px 0; padding: 14px 18px; border-radius: 12px; background: var(--error-bg); }
  .error-card b { display: block; color: var(--error-ink); margin-bottom: 6px; }
  .error-card pre { margin: 0; white-space: pre-wrap; font: 15px/1.5 ui-monospace, Consolas, monospace; }

  /* ==== profile and vitals =============================================== */
  .facts { border-collapse: collapse; width: 100%; max-width: 560px; }
  .facts td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .facts td:first-child { color: var(--muted); width: 45%; }

  .sensor-note { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--card-2); }
  .sensors { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .sensor { padding: 14px; border-radius: 10px; background: var(--card); }
  .sensor .what { color: var(--muted); font-size: 15px; }
  .sensor .reading { font-size: 20px; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>

<div class="app">

  <!-- ==== sidebar ======================================================= -->
  <nav class="sidebar" aria-label="Sections">
    <div class="brand">VITALS</div>

    <button class="tab active" data-panel="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 5h16v11H9l-5 4z"/></svg>
      Chat
    </button>
    <button class="tab" data-panel="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profile
    </button>
    <button class="tab" data-panel="vitals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M2 12h5l2-5 4 10 2-5h7"/></svg>
      Vitals
    </button>

    <div class="who">
      <div class="name" id="who-name">…</div>
      <div class="role" id="who-role"></div>
      <button class="lock" id="lock">Lock screen</button>
    </div>
  </nav>

  <main>
    <header class="topbar">
      <h1 id="panel-title">Chat</h1>
      <span class="note">Decision support - not a diagnosis</span>
    </header>

    <!-- ==== chat ======================================================== -->
    <section class="panel" id="panel-chat">
      <div class="notice" id="emergency-notice" hidden>
        Emergency access: you are not logged in. The ground crew will see this
        case as emergency access.
      </div>

      <div class="log" id="log" aria-live="polite">
        <p class="empty-hint" id="empty-hint">
          Tell VITALS how you feel, in your own words. Say the flight day if you know it.
          VITALS will ask follow-up questions.
        </p>
      </div>

      <form class="composer" id="composer">
        <p class="asking" id="asking" hidden><b>VITALS asks:</b> <span id="asking-text"></span></p>
        <div class="composer-row">
          <label for="message" hidden>Your message</label>
          <textarea id="message" placeholder="Describe how you feel…"></textarea>
          <button class="send" id="send" type="submit">Send</button>
        </div>
        <div class="row2">
          <button class="link-button" id="new-case" type="button">Start a new case</button>
        </div>
      </form>
    </section>

    <!-- ==== profile ===================================================== -->
    <section class="panel" id="panel-profile" hidden>
      <div class="panel-body" id="profile-body"></div>
    </section>

    <!-- ==== vitals ====================================================== -->
    <section class="panel" id="panel-vitals" hidden>
      <div class="panel-body">
        <p class="sensor-note" id="sensor-note">Checking sensors…</p>
        <div class="sensors" id="sensor-slots"></div>
      </div>
    </section>
  </main>
</div>

<script>
/* ==========================================================================
   Settings
   ========================================================================== */

// Lock the screen after this long with no taps or typing. Station screens are shared.
const IDLE_LOCK_MINUTES = 10;

// The four vitals the hardware plan targets (see claude/hardware-sensors.md).
// Only the NAMES live here. Readings will come from the server once sensors exist.
const PLANNED_SENSORS = ["Heart rate", "Blood oxygen (SpO2)", "Blood pressure", "Temperature"];

// Escalation levels, most serious first. The word is always shown with the color.
const LEVEL_WORDS = {
  emergency: "EMERGENCY",
  urgent:    "URGENT",
  monitor:   "MONITOR",
  routine:   "ROUTINE",
  none:      "NO MATCH",
};
const LEVEL_ORDER = ["routine", "monitor", "urgent", "emergency"];

// The model rates each condition high / moderate / low. Shown as words, never numbers.
const STRENGTH_WORDS = { high: "Strong match", moderate: "Possible", low: "Unlikely" };


/* ==========================================================================
   Small helpers
   ========================================================================== */

// Make an element. Text always goes in as textContent, so nothing from the
// server can ever be run as HTML.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const $ = id => document.getElementById(id);

async function postJSON(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  return { status: response.status, data: await response.json() };
}

function backToLogin() {
  window.location.href = "/";
}


/* ==========================================================================
   Who is logged in
   ========================================================================== */

let me = null;

async function loadSession() {
  const response = await fetch("/api/me");
  if (response.status === 401) return backToLogin();
  me = await response.json();

  $("who-name").textContent = me.name;
  $("who-role").textContent = me.emergency ? "Emergency access" : "Astronaut";
  $("emergency-notice").hidden = !me.emergency;
  drawProfile();
}

async function lockScreen() {
  await postJSON("/api/logout");
  backToLogin();
}
$("lock").onclick = lockScreen;

// Idle lock: any tap or key press restarts the countdown.
let idleTimer = null;
function restartIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(lockScreen, IDLE_LOCK_MINUTES * 60 * 1000);
}
["click", "keydown", "touchstart"].forEach(name => document.addEventListener(name, restartIdleTimer));


/* ==========================================================================
   Sidebar tabs
   ========================================================================== */

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => showPanel(tab.dataset.panel, tab.textContent.trim());
});

function showPanel(name, title) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.panel === name));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "panel-" + name);
  $("panel-title").textContent = title;
  if (name === "vitals") drawVitals();
}


/* ==========================================================================
   The case: everything said so far, sent to the server as one text
   ========================================================================== */

let caseText = "";                  // the complaint plus every question and answer
let corrections = {};               // { finding_id: true/false } fixed by the crewmember
let askedQuestions = new Set();     // so the same question is never asked twice
let currentQuestion = null;         // the question on screen right now, if any
let busy = false;

// Kept so "Start a new case" can put the starting hint back.
const emptyHint = $("empty-hint").cloneNode(true);

function startNewCase() {
  caseText = "";
  corrections = {};
  askedQuestions = new Set();
  setQuestion(null);
  $("log").innerHTML = "";
  $("log").appendChild(emptyHint.cloneNode(true));
  $("message").value = "";
  $("message").focus();
}
$("new-case").onclick = () => {
  if (!caseText || confirm("Start a new case? This conversation will be cleared from the screen.")) {
    startNewCase();
  }
};

$("composer").onsubmit = event => {
  event.preventDefault();
  const text = $("message").value.trim();
  if (!text || busy) return;

  $("empty-hint")?.remove();
  showCrewMessage(text, currentQuestion);

  // An answer to a question is saved WITH its question, so the text makes
  // sense on its own: "Do you have a fever? no".
  const line = currentQuestion ? `${currentQuestion} ${text}` : text;
  caseText = caseText ? `${caseText}\n${line}` : line;

  $("message").value = "";
  askVitals();
};

// Enter sends; Shift+Enter makes a new line.
$("message").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

function correctFinding(finding) {
  if (busy) return;
  const wasYes = finding.value === "yes";
  corrections[finding.id] = !wasYes;
  showCrewMessage(`Correction: ${finding.label} - ${wasYes ? "no" : "yes"}`);
  askVitals();
}

async function askVitals() {
  busy = true;
  $("send").disabled = true;
  const working = showWorking();

  try {
    const { status, data } = await postJSON("/api/ask", { complaint: caseText, corrections });
    if (status === 401) return backToLogin();
    working.stop();
    if (data.ok) showAnswer(data);
    else showError(data.error);
  } catch (error) {
    working.stop();
    showError("Cannot reach the VITALS server. Is it still running?\n\n" + error.message);
  } finally {
    busy = false;
    $("send").disabled = false;
    $("message").focus();
  }
}


/* ==========================================================================
   Drawing the chat
   ========================================================================== */

function addToLog(node) {
  $("log").appendChild(node);
  node.scrollIntoView({ block: "nearest" });
}

// An answer is scrolled so its TOP (the level) is showing - acceptance criteria 1.1.
// Done last, after the "VITALS asks" line has changed the layout.
function scrollToTopOf(node) {
  $("log").scrollTop = node.offsetTop - 12;     // .log is position:relative, so offsetTop is inside it
}

function showCrewMessage(text, question) {
  const bubble = el("div", "bubble");
  if (question) bubble.appendChild(el("span", "label", question));
  bubble.appendChild(document.createTextNode(text));
  addToLog(bubble);
}

// "VITALS is thinking… 12s". Local models take a while; this stops double taps.
function showWorking() {
  const box = el("div", "working");
  box.appendChild(el("div", "spinner"));
  const text = el("span", null, "VITALS is thinking…");
  box.appendChild(text);
  addToLog(box);

  const started = Date.now();
  const timer = setInterval(() => {
    const seconds = Math.round((Date.now() - started) / 1000);
    text.textContent = `VITALS is thinking… ${seconds}s`;
  }, 1000);

  return { stop() { clearInterval(timer); box.remove(); } };
}

// The server's own error text, unchanged. It already says how to fix the problem.
function showError(message) {
  const card = el("div", "error-card");
  card.appendChild(el("b", null, "VITALS could not answer"));
  card.appendChild(el("pre", null, message || "No error message was sent."));
  addToLog(card);
}

function setQuestion(question) {
  currentQuestion = question;
  $("asking").hidden = !question;
  $("asking-text").textContent = question || "";
  $("message").placeholder = question ? "Type your answer…" : "Describe how you feel…";
}

// The overall level for this answer: the top condition's urgency. If the
// engine escalated, it is shown as at least URGENT - the engine never gets
// overruled downward by the screen.
function levelOf(answer) {
  const top = answer.differential[0];
  if (!top) return answer.escalate ? "urgent" : "none";
  let level = LEVEL_ORDER.includes(top.urgency) ? top.urgency : "routine";
  if (answer.escalate && LEVEL_ORDER.indexOf(level) < LEVEL_ORDER.indexOf("urgent")) level = "urgent";
  return level;
}

// The server adds "   [finding_id]" to each question. The crew never sees ids.
function cleanQuestion(question) {
  return question.replace(/\s*\[[a-z0-9_]+\]\s*$/, "").trim();
}

function showAnswer(answer) {
  const card = el("article", "answer");

  // ---- 1. the level, first thing on the card ----
  const level = levelOf(answer);
  const band = el("div", "level " + level);
  band.appendChild(el("span", "word", LEVEL_WORDS[level]));
  if (answer.escalate) {
    band.appendChild(el("span", "escalate", "Contact ground medical now"));
    if (answer.escalation_reason) band.appendChild(el("span", "reason", answer.escalation_reason));
  }
  card.appendChild(band);

  const body = el("div", "answer-body");
  card.appendChild(body);

  // ---- 2. what it could be ----
  if (answer.differential.length === 0) {
    body.appendChild(el("p", null,
      "Nothing in the VITALS knowledge base fits what you described. Tell the ground crew."));
  } else {
    body.appendChild(el("h3", null, "What it could be"));
    answer.differential.forEach(condition => body.appendChild(drawCondition(condition)));
  }

  // ---- 3. what to do: the top condition's advice, from the knowledge base ----
  const top = answer.differential[0];
  if (top && top.recommend.length) {
    body.appendChild(el("h3", null, "What to do"));
    const list = el("ul");
    top.recommend.forEach(step => list.appendChild(el("li", null, step)));
    body.appendChild(list);
  }

  // ---- 4. what VITALS is least sure about ----
  if (answer.uncertainty) {
    body.appendChild(el("h3", null, "Least sure about"));
    body.appendChild(el("p", null, answer.uncertainty));
  }

  // ---- 5. what VITALS understood, with a way to fix mistakes ----
  body.appendChild(drawKnown(answer.known || []));

  addToLog(card);

  // ---- 6. the next question, one at a time, never the same one twice ----
  const next = (answer.next_questions || []).map(cleanQuestion).find(q => q && !askedQuestions.has(q));
  if (next) askedQuestions.add(next);
  setQuestion(next || null);

  scrollToTopOf(card);
}

function drawCondition(condition) {
  const box = el("div", "condition");

  const head = el("div", "head");
  head.appendChild(el("span", "name", condition.name));
  head.appendChild(el("span", "strength", STRENGTH_WORDS[condition.confidence] || "Possible"));
  box.appendChild(head);

  if (condition.reasoning) box.appendChild(el("p", "why", condition.reasoning));

  // Sources come from the knowledge base. If there are none, say so - never hide the condition.
  if (!condition.sources || condition.sources.length === 0) {
    box.appendChild(el("div", "no-source", "No source was sent for this condition."));
  } else {
    condition.sources.forEach(source => {
      const line = el("div", "source");
      const link = el("a", null, source.title || source.url);
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener";
      line.appendChild(link);
      box.appendChild(line);
    });
  }
  return box;
}

function drawKnown(known) {
  const box = el("details", "known");
  box.appendChild(el("summary", null, `What VITALS understood (${known.length})`));

  if (known.length === 0) {
    box.appendChild(el("p", "corrected", "Nothing specific yet."));
  }
  known.forEach(finding => {
    const row = el("div", "known-row");
    const text = el("span", null, `${finding.label}: ${finding.value}`);
    if (finding.id in corrections) text.appendChild(el("span", "corrected", "  (you corrected this)"));
    row.appendChild(text);

    // Only yes/no items can be flipped. Pressing it re-runs VITALS with the fix.
    if (finding.correctable) {
      const fix = el("button", "fix", "Wrong?");
      fix.type = "button";
      fix.title = `Tell VITALS this is ${finding.value === "yes" ? "not" : ""} true`;
      fix.onclick = () => correctFinding(finding);
      row.appendChild(fix);
    }
    box.appendChild(row);
  });
  return box;
}


/* ==========================================================================
   Profile and vitals
   ========================================================================== */

function drawProfile() {
  const body = $("profile-body");
  body.innerHTML = "";
  if (me.emergency) {
    body.appendChild(el("p", null, "Emergency access has no profile. Lock the screen and log in with your PIN to see it."));
    return;
  }
  body.appendChild(el("h2", null, me.name));
  const entries = Object.entries(me.profile || {});
  if (entries.length === 0) {
    body.appendChild(el("p", null, "No profile details are on file."));
    return;
  }
  const table = el("table", "facts");
  entries.forEach(([label, value]) => {
    const row = el("tr");
    row.appendChild(el("td", null, label));
    row.appendChild(el("td", null, value));
    table.appendChild(row);
  });
  body.appendChild(table);
}

async function drawVitals() {
  const slots = $("sensor-slots");
  slots.innerHTML = "";
  PLANNED_SENSORS.forEach(name => {
    const slot = el("div", "sensor");
    slot.appendChild(el("div", "what", name));
    slot.appendChild(el("div", "reading", "Not connected"));
    slots.appendChild(slot);
  });

  try {
    const health = await (await fetch("/api/health")).json();
    $("sensor-note").textContent = health.sensors === "no sensors connected"
      ? "No sensor connected. Nothing has been measured - VITALS only knows what you tell it."
      : `Sensors: ${health.sensors}`;
  } catch (error) {
    $("sensor-note").textContent = "Cannot reach the VITALS server to check sensors.";
  }
}


/* ==========================================================================
   Start
   ========================================================================== */

loadSession();
restartIdleTimer();
$("message").focus();
</script>
