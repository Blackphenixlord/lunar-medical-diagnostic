# VITALS prompt bank
# ---------------
# Realistic crewmember complaints for testing the system end to end.
#
# WHAT THESE ARE: test INPUTS. Things a person might plausibly say, written the
# way people actually talk - terse, rambling, with denials, with typos.
#
# WHAT THESE ARE NOT: evidence, patient records, or data about anyone real.
# Nothing here is presented as a fact about a real crewmember, and none of it
# is used to justify a rule. The rules are justified by the sources in
# kb/conditions/*.yaml. These sentences only exercise the pipeline.
#
# expect: the condition id the top answer SHOULD be, or `none` when the right
#         answer is "nothing in the knowledge base fits".
# escalate: true when a flight surgeon should be pulled in.
# why: what this prompt is testing. If you cannot say why, it does not belong.
#
# Add to this file whenever someone phrases something in a way VITALS misses.
# That is the single most useful contribution a non-programmer can make.

version: 1

prompts:

  # ---------- classic presentations: the easy ones must never break ----------

  - id: sms_classic
    category: classic
    text: "flight day 2 and I feel awful, like I'm going to throw up any second, and it gets way worse every time I turn my head. Threw up twice already. Cold sweats."
    expect: space_motion_sickness
    escalate: false
    why: Textbook space motion sickness in the first 72 hours.

  - id: renal_classic
    category: classic
    text: "Flight day 63. Woke up with really bad pain in my right side, maybe 8 out of 10. It comes and goes in waves and shoots down toward my groin. There's blood in my urine."
    expect: renal_stone
    escalate: true
    why: Textbook renal colic. The single most mission-threatening case on the list.

  - id: sans_classic
    category: classic
    text: "Around flight day 118. Reading the procedure cards is getting harder, everything close up is blurry. Refraction is about a diopter more hyperopic than my preflight baseline. OCT shows disc edema and choroidal folds. No double vision."
    expect: sans
    escalate: false
    why: SANS case definition with the discriminator (no diplopia) included.

  - id: congestion_classic
    category: classic
    text: "I've been stuffed up basically since I got here and it never really cleared. My face feels full all the time. No fever, no sore throat, nothing green."
    expect: sinonasal_congestion
    escalate: false
    why: Fluid shift, not infection. Time course is the tell.

  - id: vte_classic
    category: classic
    text: "Flight day 30. The left side of my neck looks swollen compared to the right and I'm a little short of breath. Chest feels tight. Ultrasound shows the jugular doesn't compress."
    expect: jugular_vte
    escalate: true
    why: The rare one that can kill someone. Must never be buried.

  - id: sleep_classic
    category: classic
    text: "I'm getting maybe four hours a night. Can't fall asleep, been taking the sleep aid most nights. My reaction time feels slow and I'm snapping at people."
    expect: sleep_disruption_circadian
    escalate: false
    why: The most common problem on ISS. Cognitive slowing is what makes it operational.

  - id: shoulder_classic
    category: classic
    text: "Shoulder's been killing me since the EVA on Tuesday, about a 6. Can't raise my arm all the way."
    expect: msk_shoulder_overuse
    escalate: false
    why: Highest-volume injury category in flight.

  - id: co2_classic
    category: classic
    text: "Splitting headache all afternoon and I can't concentrate on anything. Danny's got one too. We've both been working head-down in the rack."
    expect: tension_headache_co2
    escalate: false
    why: >
      The only condition diagnosed by asking about SOMEONE ELSE. Two crew with
      simultaneous headaches means suspect the atmosphere, not the people.

  - id: orthostatic_classic
    category: classic
    text: "We landed about six hours ago. Every time I try to stand up I get lightheaded and feel like I'm going to pass out. Heart's racing."
    expect: orthostatic_intolerance
    escalate: true
    why: The one that is dangerous on the ground, not on orbit.

  - id: urti_classic
    category: classic
    text: "Started three days ago out of nowhere. Sore throat, coughing, feel run down, temp is 38.6."
    expect: urti
    escalate: false
    why: Real infection - distinct onset, fever, sore throat. Contrast with congestion_classic.

  - id: back_classic
    category: classic
    text: "Lower back has been aching since about day 4. Dull, constant. I measured and I'm almost 4 cm taller than preflight."
    expect: msk_back_pain_adaptation
    escalate: false
    why: Benign adaptation. Must be preferred over renal colic when nothing points renal.

  # ---------- mimics: same words, different answer ----------

  - id: mimic_sms_late
    category: mimic
    text: "flight day 90, I keep feeling like I'm going to throw up and it's worse when I move my head. Threw up twice."
    expect: none
    escalate: false
    why: >
      Word-for-word almost identical to sms_classic but on day 90. Space motion
      sickness is a first-72-hours phenomenon. A system that still says SMS here
      is pattern-matching, not reasoning.

  - id: mimic_back_vs_renal
    category: mimic
    text: "My back is killing me on the right side, about a 7. It comes in waves and there's blood when I pee."
    expect: renal_stone
    escalate: true
    why: >
      Crewmember says BACK, but colicky plus hematuria means renal until proven
      otherwise. Body region must not beat the character of the pain.

  - id: mimic_cold_vs_fluidshift
    category: mimic
    text: "Nose is completely blocked and my head feels heavy. Been like this the whole mission. Temp is 36.7."
    expect: sinonasal_congestion
    escalate: false
    why: Sounds like a cold. Is physics. Getting this wrong wastes scarce antibiotics.

  - id: mimic_puffy_face
    category: mimic
    text: "My face is puffy and my nose is blocked."
    expect: sinonasal_congestion
    escalate: false
    why: >
      Facial fullness is near-universal on orbit from the fluid shift. It must
      NOT drag the jugular clot rule up on its own - that is a false alarm
      generator.

  - id: mimic_headache_alone
    category: mimic
    text: "I have a headache."
    expect: none
    escalate: false
    why: >
      Deliberately almost information-free. A good system asks a question here.
      A bad one picks whatever has the highest base rate and states it.

  # ---------- how people actually talk ----------

  - id: talk_rambling
    category: phrasing
    text: "ok so this is probably nothing but like since yesterday my side has been hurting? not constantly, it kind of comes and goes, and honestly the worst part is when it hits it REALLY hits. also i think there was some blood when i went to the bathroom but the lighting in here is bad so idk"
    expect: renal_stone
    escalate: true
    why: How a nervous person actually reports this. Hedged, lowercase, uncertain.

  - id: talk_terse
    category: phrasing
    text: "fd2. naseaus. head movement makes it worse. threw up."
    expect: space_motion_sickness
    escalate: false
    why: Terse with a typo and an abbreviation. Should still work.

  - id: talk_denials
    category: phrasing
    text: "No fever, no sore throat, no cough. Just totally blocked up and my face feels full, and it's been that way since launch."
    expect: sinonasal_congestion
    escalate: false
    why: >
      Almost entirely NEGATIVE statements. Regression guard - a negation once
      leaked across a sentence boundary and inverted a finding.

  - id: talk_minimizing
    category: phrasing
    text: "It's fine, I don't want to make a thing of it, but my neck's a bit swollen on one side and I'm a little more out of breath than usual."
    expect: jugular_vte
    escalate: true
    why: >
      Crew minimize. The tool must not minimize with them. Understated
      presentation of the most dangerous condition on the list.

  - id: talk_multiple
    category: phrasing
    text: "Flight day 50. Barely sleeping, maybe 4 hours, and I've had a headache most of the week. Shoulder's sore too from ARED."
    expect: sleep_disruption_circadian
    escalate: false
    why: Three complaints at once. Should produce a real multi-entry differential.

  # ---------- the answer is "I don't know" ----------

  - id: dental_classic
    category: classic
    text: "I think I cracked a filling. There's a sharp pain in my back molar when I drink anything cold, about a 6, and it hurts to bite on that side."
    expect: dental_emergency
    escalate: false
    why: >
      Was a known gap until 23 Aug - the correct answer used to be "nothing
      fits". Now a rule exists. Rare (NASA IMM 2016: abscess ~0.008 per
      person-year) but a dental abscess is the condition NASA rates most likely
      to force an ISS evacuation, so it must be recognised.

  - id: none_psych
    category: nothing_fits
    text: "I've been feeling really low and disconnected from the crew for a couple weeks now."
    expect: none
    escalate: false
    why: >
      Behavioural health is deliberately excluded from v1 - a scoring engine is
      the wrong tool and a wrong answer does real harm. Must return nothing and
      route to a human, not guess.

  - id: none_nonsense
    category: nothing_fits
    text: "my quantum flux capacitor feels misaligned"
    expect: none
    escalate: false
    why: Garbage in must not produce a confident diagnosis out.

  - id: wound_classic
    category: classic
    text: "I caught my hand in the hatch and there's a deep cut across two knuckles, bleeding a fair amount, and the edges fall open when I let go."
    expect: wound_laceration
    escalate: true
    why: >
      Was a known gap until 23 Aug. Gaping edges is the finding that decides
      suture versus dressing, which is why it is in the prompt.

  - id: dcs_type1
    category: classic
    text: "Came in off the EVA about two hours ago. My left shoulder has this deep boring ache, maybe a 7, and there's a weird blotchy marbled rash on my forearm."
    expect: decompression_sickness
    escalate: true
    why: >
      Classic Type I DCS after a decompression exposure - joint pain plus
      cutis marmorata. The EVA in the first sentence is the whole diagnosis.

  - id: dcs_type2
    category: classic
    text: "Post-EVA, prebreathe got cut short because of the timeline. He's confused, his balance is off and he says his arm feels weak."
    expect: decompression_sickness
    escalate: true
    why: >
      Type II - central nervous system involvement, potentially fatal. NASA has
      never had a Type II event in spaceflight; if we ever see this the tool must
      not hesitate.

  - id: mimic_shoulder_vs_dcs
    category: mimic
    text: "Shoulder's aching after the EVA on Tuesday, about a 6. No rash, no numbness, nothing else. That was four days ago."
    expect: msk_shoulder_overuse
    escalate: false
    why: >
      Shoulder pain after EVA is FAR more often suit overuse than DCS. The
      discriminators are time (days later, not hours), no skin or neuro signs.
      If this reads as decompression sickness the tool cries wolf on the
      commonest EVA complaint there is.

  - id: mimic_dental_vs_sinus
    category: mimic
    text: "Upper back teeth ache and my face feels full. I've been congested since I got here though."
    expect: sinonasal_congestion
    escalate: false
    why: >
      Upper molar pain and sinus congestion genuinely overlap. On orbit
      congestion is near-universal from the fluid shift, so "since I got here"
      should still win over a dental cause.

  - id: none_eye_foreign_body
    category: classic
    text: "Something flew into my eye while I was working in the rack and it's watering and stinging."
    expect: eye_foreign_body
    escalate: false
    why: >
      Ocular foreign body is a real ISS hazard - debris does not fall in
      microgravity, it floats at head height. This was a "nothing fits" prompt
      until the eye_foreign_body rule was added (2 Oct 2026). Id kept so old
      benchmark runs still line up.

  - id: none_burn
    category: classic
    text: "I burned my forearm on a hot surface during the payload swap, it's red and blistering."
    expect: burn
    escalate: false
    why: >
      Small second-degree burn. Was a "nothing fits" gap until the burn rule
      (2 Oct 2026). Still must not be swallowed by the laceration rule -
      different treatment entirely. Id kept so old benchmark runs line up.

  - id: none_radiation
    category: nothing_fits
    text: "There was a solar particle event alert. Should I be worried about my radiation dose?"
    expect: none
    escalate: false
    why: >
      Deliberate non-rule. Radiation risk is DOSIMETRY and long-term cancer
      probability, not a symptom you can diagnose from a complaint - acute
      radiation syndrome does not present at ISS dose rates. A symptom-driven
      engine is the wrong tool and it must say so rather than guess.

  - id: dental_abscess
    category: classic
    text: "Tooth has been killing me for two days, a 9 now, and it's waking me up at night. The gum and my cheek are swollen on that side. Temp is 38.7."
    expect: dental_emergency
    escalate: true
    why: >
      The dangerous dental branch - swelling plus fever means a spreading
      infection. Also the regression guard for alarm noise: fever is a red flag
      in four rules, and this case used to raise four separate alarms.

  # ---------- general conditions added 2 Oct 2026 (NASA IMM baselines) ----------

  - id: rash_classic
    category: classic
    text: "I've got an itchy red rash under the harness straps where my shirt rubs. Been there three days, no fever."
    expect: skin_rash
    escalate: false
    why: Friction and sweat rash - the most common skin complaint on ISS.

  - id: uti_classic
    category: classic
    text: "It burns when I pee and I keep having to pee every twenty minutes, plus pressure low in my belly. No fever, no pain in my side."
    expect: urinary_tract_infection
    escalate: false
    why: Simple bladder infection. The denials (no fever, no flank pain) are what keep it from escalating.

  - id: mimic_uti_vs_renal
    category: mimic
    text: "Blood in my urine and it burns when I pee, but the pain comes in waves and shoots down to my groin."
    expect: renal_stone
    escalate: true
    why: >
      UTI and kidney stone both cause blood and burning. Pain in waves that
      spreads to the groin is the stone. Must not settle for the milder answer.

  - id: diarrhea_classic
    category: classic
    text: "Diarrhea since last night with stomach cramps and some nausea. Two of us are sick with the same thing."
    expect: diarrhea_gastroenteritis
    escalate: false
    why: Stomach bug. Two sick crew should push the advice toward checking food and water.

  - id: constipation_classic
    category: classic
    text: "Flight day 3. I have not been able to poop since we got here and my belly is bloated. Not vomiting."
    expect: constipation_adaptation
    escalate: false
    why: Space adaptation constipation in the first days.

  - id: appendicitis_classic
    category: classic
    text: "Flight day 80. Pain started around my belly button yesterday and moved to the lower right part of my belly. No appetite, it hurts more when I cough, temp 38.2."
    expect: appendicitis
    escalate: true
    why: The textbook story. No surgery on orbit, so this must escalate.

  - id: allergy_classic
    category: classic
    text: "I took a new medication an hour ago and now I've got hives all over my arms, really itchy, and I keep sneezing. No trouble breathing."
    expect: allergic_reaction
    escalate: false
    why: Mild reaction to a medicine - the most common cause on orbit per NASA. The breathing denial keeps it out of anaphylaxis.

  - id: anaphylaxis_classic
    category: classic
    text: "I took a new antibiotic and now my throat feels tight, my lips are swelling, I'm wheezing and I feel light headed."
    expect: anaphylaxis
    escalate: true
    why: Anaphylaxis. Epinephrine now. The single most time-critical prompt in the bank.

  - id: acs_classic
    category: classic
    text: "Flight day 120. Crushing chest pain that started while I was on the treadmill, it goes down my left arm, I'm in a cold sweat and short of breath."
    expect: acute_coronary_syndrome
    escalate: true
    why: Classic heart attack story. Rare in screened crew, never seen in flight, and not survivable to miss.

  - id: mimic_chest_wall
    category: mimic
    text: "My chest hurts on the right side after ARED, it's sore when I press on it and sharper when I take a deep breath."
    expect: none
    escalate: false
    why: >
      Chest wall strain after resistive exercise. The heart rule must NOT win -
      pain you can reproduce by pressing, and that is sharper on breathing,
      argues against the heart. We have no chest-wall rule, so the right answer
      is "nothing fits", not a cardiac alarm.

  - id: head_injury_classic
    category: classic
    text: "I hit my head on the hatch, I think I blacked out for a second, now I have a headache and I can't remember what happened right before."
    expect: head_injury
    escalate: true
    why: Concussion with loss of consciousness and a memory gap - both red flags.

  - id: toxic_classic
    category: classic
    text: "There was an ammonia smell and the alarm went off. Now my throat burns, I'm coughing and my eyes are watering. The commander has the same symptoms."
    expect: toxic_inhalation
    escalate: true
    why: Ammonia leak. Two crew with the same symptoms at once means the air, not a bug.
